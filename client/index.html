<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Run before any blocking stylesheets. A stalled stylesheet can otherwise
      // prevent even the HTML recovery script from executing.
      setTimeout(function () {
        document.querySelectorAll('link[rel="stylesheet"]').forEach(function (link) {
          if (link.sheet || link.media === "print") return;
          window.__APP_STYLE_BLOCKED__ = true;
          link.addEventListener("load", function () { link.media = "all"; }, { once: true });
          link.media = "print";
        });
      }, 8000);
    </script>
    <!-- Batman oval favicon: yellow oval, black bat silhouette (final production path) -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <!-- Independent of React, downloaded styles, fonts and application chunks. -->
    <style>
      body { margin: 0; background: #090b0f; }
      .batcave-recovery { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; display: grid; place-items: center; padding: 24px; background: #090b0f; color: #e7e9ee; font: 16px/1.6 "DM Sans", system-ui, sans-serif; }
      .batcave-recovery section { width: 100%; max-width: 440px; }
      .batcave-recovery h1 { font-size: 22px; line-height: 1.3; margin: 12px 0; }
      .batcave-recovery p { color: #aeb6c4; margin: 12px 0; }
      .batcave-recovery button { cursor: pointer; padding: 12px 18px; min-height: 44px; font: inherit; font-weight: 600; color: #101114; background: #facc15; border: 0; border-radius: 10px; }
      .batcave-recovery button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
      .batcave-recovery small { display: block; margin-top: 20px; color: #aeb6c4; font-size: 12px; }
      #batcave-boot[hidden] { display: none; }
    </style>
    <div id="batcave-boot" class="batcave-recovery" data-testid="startup-static">
      <section aria-live="polite">
        <span>BATCAVE</span>
        <h1 id="boot-title">Opening your terminal</h1>
        <p id="boot-detail">Loading the application. Market data loads separately once you enter.</p>
        <button id="boot-reload" type="button" data-testid="button-boot-reload">Reload Batcave</button>
        <small id="boot-code">Startup · BC-BOOT · 2026-09-30.1</small>
        <noscript><p>JavaScript is disabled. Enable it to open the terminal.</p></noscript>
      </section>
    </div>
    <div id="root"></div>
    <script>
      // This recovery surface survives missing entry/vendor chunks. Never
      // auto-reload: a failed second request must remain readable and actionable.
      (function () {
        document.getElementById("boot-reload").addEventListener("click", function () {
          var url = new URL(window.location.href);
          url.searchParams.set("wdbust", String(Date.now()));
          window.location.replace(url.href);
        });
        setTimeout(function () {
          if (window.__APP_BOOTED__) return;
          document.getElementById("boot-title").textContent = "Startup is taking longer than expected";
          document.getElementById("boot-detail").textContent = "An application file may be unavailable or your connection may be interrupted. Reload to request the latest version. If this repeats, share the BC-BOOT code.";
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
