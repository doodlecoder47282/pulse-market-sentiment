name: Batcave build (web + iOS)

# Web job: installs, type-checks, builds, boots the production server and
# smoke-tests it (health, UI, access-key gate, iOS CORS).
# iOS job: generates/syncs the Capacitor Xcode project, compiles it for the
# iOS Simulator without signing, and publishes a ready-to-open Xcode zip.

on:
  push:
    branches: [ios-capacitor]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batcave-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check (reported, not blocking)
        continue-on-error: true
        run: |
          npx tsc --noEmit -p tsconfig.json 2>&1 | tee tsc.log
          echo "tsc error count = $(grep -c 'error TS' tsc.log || true)"
      - name: Production build
        run: npm run build
      - name: Boot server and smoke test
        shell: bash
        run: |
          exec > >(tee smoke.log) 2>&1
          set -u
          fail=0
          check() { if [ "$1" = "$2" ]; then echo "PASS $3 ($1)"; else echo "FAIL $3 (got $1, want $2)"; fail=1; fi; }
          wait_up() { for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:$1/api/health" >/dev/null 2>&1 && return 0; sleep 1; done; return 1; }

          NODE_ENV=production PORT=5055 HOST=127.0.0.1 node dist/index.cjs > server-open.log 2>&1 &
          OPEN_PID=$!
          wait_up 5055 || { echo "server did not start"; tail -80 server-open.log; exit 1; }
          check "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5055/)" 200 "UI index served"
          curl -s http://127.0.0.1:5055/ | grep -q '<div id="root">' && echo "PASS UI html has root" || { echo "FAIL UI html"; fail=1; }
          check "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5055/api/health)" 200 "health"
          check "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5055/api/schwab/status)" 200 "schwab status route"
          check "$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: capacitor://localhost' -H 'Access-Control-Request-Method: GET' http://127.0.0.1:5055/api/health)" 204 "iOS CORS preflight"
          curl -s -D - -o /dev/null -H 'Origin: capacitor://localhost' http://127.0.0.1:5055/api/health | grep -qi '^access-control-allow-origin: capacitor://localhost' && echo "PASS iOS CORS header" || { echo "FAIL iOS CORS header"; fail=1; }
          curl -s -D - -o /dev/null -H 'Origin: https://evil.example' http://127.0.0.1:5055/api/health | grep -qi '^access-control-allow-origin' && { echo "FAIL foreign origin allowed"; fail=1; } || echo "PASS foreign origin not allowed"
          echo "--- sample endpoint status codes (data depends on live sources) ---"
          for p in /api/schwab/status /api/regime /api/quotes /api/news /api/crypto/scanner; do
            echo "$p -> $(curl -s -o /dev/null -m 20 -w '%{http_code}' http://127.0.0.1:5055$p)"
          done
          OPEN_GAMMA_NOTE=$(curl -s -m 60 http://127.0.0.1:5055/api/trade-environment | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const d=(j.drivers||[]).find(x=>x.key==="gamma");console.log(d?d.note:"no-gamma-driver")}catch(e){console.log("unparseable")}})' )
          echo "open server gamma driver: $OPEN_GAMMA_NOTE"
          kill $OPEN_PID || true; sleep 2

          NODE_ENV=production PORT=5056 HOST=127.0.0.1 BATCAVE_ACCESS_KEY=ci-test-key BATCAVE_DATA_DIR=$RUNNER_TEMP/persist node dist/index.cjs > server-gated.log 2>&1 &
          GATED_PID=$!
          wait_up 5056 || { echo "gated server did not start"; tail -80 server-gated.log; exit 1; }
          curl -s http://127.0.0.1:5056/api/health | grep -q '"authRequired":true' && echo "PASS health reports auth" || { echo "FAIL health auth flag"; fail=1; }
          check "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5056/api/schwab/status)" 401 "gate blocks without key"
          check "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-batcave-key: wrong' http://127.0.0.1:5056/api/schwab/status)" 401 "gate blocks wrong key"
          check "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-batcave-key: ci-test-key' http://127.0.0.1:5056/api/schwab/status)" 200 "gate allows right key"
          check "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5056/)" 200 "UI still served when gated"
          GATED_GAMMA_NOTE=$(curl -s -m 60 -H "x-batcave-key: ci-test-key" http://127.0.0.1:5056/api/trade-environment | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const d=(j.drivers||[]).find(x=>x.key==="gamma");console.log(d?d.note:"no-gamma-driver")}catch(e){console.log("unparseable")}})' )
          echo "gated server gamma driver: $GATED_GAMMA_NOTE"
          if echo "$OPEN_GAMMA_NOTE" | grep -qv "unavailable" && echo "$GATED_GAMMA_NOTE" | grep -q "unavailable"; then echo "FAIL internal self-calls blocked by access key"; fail=1; else echo "PASS internal self-calls work with access key on"; fi
          kill $GATED_PID || true
          [ -f "$RUNNER_TEMP/persist/data.db" ] && echo "PASS data dir holds data.db" || { echo "FAIL data dir"; ls -la "$RUNNER_TEMP/persist" || true; fail=1; }
          echo "--- server log tail ---"; tail -40 server-open.log
          exit $fail
      - name: Screenshot the UI
        continue-on-error: true
        run: |
          npx --yes playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          NODE_ENV=production PORT=5057 HOST=127.0.0.1 node dist/index.cjs > server-shot.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5057/api/health >/dev/null 2>&1 && break; sleep 1; done
          cat > shot.mjs <<'EOF'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          for (const [name, vp] of [["desktop", { width: 1440, height: 900 }], ["iphone", { width: 393, height: 852 }]]) {
            const p = await b.newPage({ viewport: vp });
            const errors = [];
            p.on("pageerror", (e) => errors.push(e.message));
            await p.goto("http://127.0.0.1:5057/#/", { waitUntil: "networkidle", timeout: 60000 }).catch(() => {});
            await p.waitForTimeout(5000);
            await p.keyboard.press("Enter").catch(() => {});
            const splashBtn = p.getByRole("button", { name: /print/i });
            if (await splashBtn.count()) await splashBtn.first().click({ timeout: 3000 }).catch(() => {});
            await p.waitForTimeout(2500);
            await p.evaluate(() => document.querySelectorAll("div").forEach((d) => { if (d.scrollHeight > d.clientHeight + 10) d.scrollTop = d.scrollHeight; }));
            await p.waitForTimeout(800);
            await p.locator('[data-testid="button-premarket-acknowledge"]').click({ timeout: 5000 }).catch((e) => console.log(name, "ack:", e.message.split("\n")[0]));
            await p.waitForTimeout(15000);
            await p.screenshot({ path: `ui-${name}.png` });
            console.log(name, "page errors:", errors.length, errors.slice(0, 3));
          }
          await b.close();
          EOF
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && node shot.mjs 2>&1 | tee shot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-build-report
          path: |
            tsc.log
            server-*.log
            ui-*.png
          if-no-files-found: ignore
      - name: Publish build report to ci-reports-web branch
        if: always()
        run: |
          mkdir -p /tmp/rep && cp -f tsc.log smoke.log server-*.log ui-*.png shot.log /tmp/rep/ 2>/dev/null || true
          echo "run ${GITHUB_RUN_ID} sha ${GITHUB_SHA}" > /tmp/rep/RUN.txt
          cd /tmp/rep && git init -q && git checkout -q -b ci-reports-web
          git -c user.name=batcave-ci -c user.email=batcave-ci@users.noreply.github.com add -A
          git -c user.name=batcave-ci -c user.email=batcave-ci@users.noreply.github.com commit -qm "web report ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-reports-web

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: |
          mkdir -p reports
          { xcodebuild -version; node -v; npm -v; sw_vers; } 2>&1 | tee reports/00-toolchain.log
      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund --ignore-scripts 2>&1 | tail -20 | tee reports/01-npm-ci.log
          if ! grep -q '"@capacitor/ios"' package.json; then
            npm install --no-audit --no-fund --ignore-scripts @capacitor/core@^8 @capacitor/ios@^8 2>&1 | tail -20 | tee -a reports/01-npm-ci.log
            npm install --no-audit --no-fund --ignore-scripts -D @capacitor/cli@^8 2>&1 | tail -20 | tee -a reports/01-npm-ci.log
          fi
          npx cap --version 2>&1 | tee -a reports/01-npm-ci.log
      - name: Build web bundle for the app
        env:
          VITE_API_BASE: ${{ vars.BATCAVE_API_BASE }}
        run: |
          set -o pipefail
          npx vite build 2>&1 | tail -30 | tee reports/02-vite.log
      - name: Create or sync the Xcode project
        run: |
          set -o pipefail
          if [ ! -d ios/App ]; then npx cap add ios 2>&1 | tee reports/03-cap.log; else npx cap sync ios 2>&1 | tee reports/03-cap.log; fi
          find ios -maxdepth 3 -not -path '*/public/*' | sort | tee -a reports/03-cap.log
      - name: Compile for iOS Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build > reports/04-xcodebuild-full.log 2>&1
          rc=$?
          grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" reports/04-xcodebuild-full.log | head -60 > reports/04-xcodebuild.log || true
          tail -40 reports/04-xcodebuild-full.log >> reports/04-xcodebuild.log
          exit $rc
      - name: Launch in iOS Simulator and screenshot
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; print(c[-1]['udid'] if c else '')")
          echo "simulator: $UDID" | tee reports/07-sim.log
          xcrun simctl boot "$UDID" 2>&1 | tee -a reports/07-sim.log
          xcrun simctl bootstatus "$UDID" -b 2>&1 | tail -2 | tee -a reports/07-sim.log
          APP=$(find build/dd/Build/Products -name 'App.app' -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP" 2>&1 | tee -a reports/07-sim.log
          xcrun simctl launch "$UDID" com.batcave.terminal 2>&1 | tee -a reports/07-sim.log
          sleep 25
          xcrun simctl io "$UDID" screenshot reports/ios-sim.png 2>&1 | tee -a reports/07-sim.log
      - name: Package Xcode project zip
        run: |
          mkdir -p out/Batcave-iOS
          rsync -a --exclude 'build' --exclude 'DerivedData' ios/ out/Batcave-iOS/ios/
          cp capacitor.config.json out/Batcave-iOS/
          printf '%s\n' \
            "Batcave iOS - Xcode project" "" \
            "1. Double-click ios/App/App.xcodeproj. Xcode opens it and resolves Swift packages." \
            "2. App target > Signing & Capabilities > Team: choose your Apple Account." \
            "   If the bundle ID is taken, change com.batcave.terminal to something unique." \
            "3. Pick your iPhone (or a simulator) and press Run." \
            "4. First launch asks for your Batcave server URL (e.g. https://xxxx.up.railway.app)" \
            "   and the access key if the server sets BATCAVE_ACCESS_KEY." "" \
            "The web UI is bundled in ios/App/App/public. After code changes, from the repo run:" \
            "npm install && npm run ios:sync, then Run again in Xcode." > out/Batcave-iOS/OPEN-ME.txt
          cd out && ditto -c -k --sequesterRsrc --keepParent Batcave-iOS Batcave-iOS-Xcode.zip && ls -la | tee -a ../reports/05-package.log
      - uses: actions/upload-artifact@v4
        with:
          name: Batcave-iOS-Xcode
          path: out/Batcave-iOS-Xcode.zip
      - name: Commit generated project back to the branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "batcave-ci"
          git config user.email "batcave-ci@users.noreply.github.com"
          git add package.json package-lock.json ios
          # Ship the synced web bundle too, so a plain clone opens and runs in Xcode.
          git add -f ios/App/App/public ios/App/App/capacitor.config.json ios/App/App/config.xml 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(ios): generate/sync Capacitor iOS project via CI"
          git push origin HEAD:${GITHUB_REF_NAME} 2>&1 | tee reports/06-commit.log
      - name: Publish build report to ci-reports-ios branch
        if: always()
        run: |
          mkdir -p /tmp/rep && cp -R reports/. /tmp/rep/ 2>/dev/null || true
          rm -f /tmp/rep/04-xcodebuild-full.log
          tail -300 reports/04-xcodebuild-full.log > /tmp/rep/04-xcodebuild-tail.log 2>/dev/null || true
          cp out/Batcave-iOS-Xcode.zip /tmp/rep/ 2>/dev/null || true
          echo "run ${GITHUB_RUN_ID} sha ${GITHUB_SHA}" > /tmp/rep/RUN.txt
          cd /tmp/rep && git init -q && git checkout -q -b ci-reports-ios
          git -c user.name=batcave-ci -c user.email=batcave-ci@users.noreply.github.com add -A
          git -c user.name=batcave-ci -c user.email=batcave-ci@users.noreply.github.com commit -qm "ios report ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-reports-ios
