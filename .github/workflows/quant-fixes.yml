name: Batcave quant fixes check

# Type-check, build, quant tests, and a route-by-route regression comparison
# between origin/main (base) and this branch (head). The report is pushed to
# the ci-reports-quant branch because agent sessions cannot read Actions logs.

on:
  push:
    branches: [quant-fixes, "feat/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quant-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install head
        run: npm ci --no-audit --no-fund
      - name: Prepare base (origin/main)
        run: |
          git worktree add ../base origin/main
          cd ../base && npm ci --no-audit --no-fund
      # Per-file tsc error counts, head vs base. The comparison is computed
      # here (never fails, so the later steps still run and report); the
      # "Type-check gate" step below fails the job when any file has more
      # errors on head than on base (a new file with errors counts, base 0).
      - name: Type check head and base (per file)
        run: |
          mkdir -p rep
          export LC_ALL=C   # sort and join must agree on collation
          npx tsc --noEmit -p tsconfig.json > rep/tsc-head.log 2>&1 || true
          (cd ../base && npx tsc --noEmit -p tsconfig.json > "$GITHUB_WORKSPACE/rep/tsc-base.log" 2>&1 || true)
          for f in head base; do grep -oE '^[^(]+\([0-9]+,[0-9]+\): error TS' rep/tsc-$f.log | sed -E 's/\(.*//' | sort | uniq -c | awk '{print $2, $1}' | sort -k1,1 > rep/tsc-$f-byfile.txt; done
          echo "tsc errors: head=$(grep -c 'error TS' rep/tsc-head.log) base=$(grep -c 'error TS' rep/tsc-base.log)" | tee rep/tsc-summary.txt
          echo "--- files with MORE errors on head (file head base) ---" >> rep/tsc-summary.txt
          join -a 1 -e 0 -o 0,1.2,2.2 rep/tsc-head-byfile.txt rep/tsc-base-byfile.txt | awk '$2>$3' | tee rep/tsc-regressed.txt >> rep/tsc-summary.txt
          # Errors with no file (config / missing type library, e.g. "error TS2688"):
          # any such line on head that base does not have is also a regression.
          for f in head base; do { grep -E '^error TS[0-9]+' rep/tsc-$f.log || true; } | sort -u > rep/tsc-$f-global.txt; done
          echo "--- file-less tsc errors new on head ---" >> rep/tsc-summary.txt
          comm -23 rep/tsc-head-global.txt rep/tsc-base-global.txt | tee rep/tsc-global-new.txt >> rep/tsc-summary.txt
          cat rep/tsc-summary.txt
      - name: Quant tests
        run: |
          node --experimental-transform-types --no-warnings \
            --import ./tests/quant/loader/register.mjs --test 'tests/quant/*.test.ts' 2>&1 | tee rep/quant-tests.log
          exit ${PIPESTATUS[0]}
        shell: bash
      - name: Production build (head and base)
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -40 | tee rep/build-head.log
          test -f dist/index.cjs || { echo "FAIL head build produced no dist/index.cjs" | tee -a rep/build-head.log; exit 1; }
          (cd ../base && npm run build 2>&1 | tail -5) > rep/build-base.log || echo "WARN base build failed" >> rep/build-base.log
      - name: Route regression and smoke tests
        shell: bash
        run: |
          exec > >(tee rep/smoke.log) 2>&1
          set -u
          fail=0
          check() { if [ "$1" = "$2" ]; then echo "PASS $3 ($1)"; else echo "FAIL $3 (got $1, want $2)"; fail=1; fi; }
          wait_up() { for i in $(seq 1 90); do curl -fsS "http://127.0.0.1:$1/api/health" >/dev/null 2>&1 && return 0; curl -fsS -o /dev/null "http://127.0.0.1:$1/" 2>/dev/null && return 0; sleep 1; done; return 1; }
          grep -ohE "app\.get\(\s*['\"]/api/[^'\"]+['\"]" server/*.ts | sed -E "s/app\.get\(\s*['\"]//; s/['\"]$//" | grep -v ":" | sort -u > rep/routes.txt
          echo "routes: $(wc -l < rep/routes.txt)"

          (cd ../base && NODE_ENV=production PORT=5061 HOST=127.0.0.1 node dist/index.cjs > "$GITHUB_WORKSPACE/rep/server-base.log" 2>&1 &)
          NODE_ENV=production PORT=5060 HOST=127.0.0.1 node dist/index.cjs > rep/server-head.log 2>&1 &
          wait_up 5060 || { echo "FAIL head server did not start"; tail -80 rep/server-head.log; exit 1; }
          wait_up 5061 || echo "WARN base server did not start"
          sleep 20   # let schedulers settle so both sides see similar warm-up

          # Each probe line: route, HTTP code, top-level dataState of a JSON body ("-" when none).
          # A 503 whose JSON body carries dataState is the intended "unavailable" contract
          # (Schwab cannot answer: shared/unavailable.ts), not a regression.
          dstate() { [ -s "$1" ] || { echo "-"; return; }; node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j&&typeof j==="object"&&!Array.isArray(j)&&typeof j.dataState==="string"&&j.dataState?j.dataState.replace(/\s+/g,"_"):"-")}catch(e){console.log("-")}})' < "$1"; }
          probe() { while read -r r; do rm -f "rep/probe-$1.body"; code=$(curl -s -o "rep/probe-$1.body" -m 45 -w '%{http_code}' "http://127.0.0.1:$1$r"); printf '%s %s %s\n' "$r" "$code" "$(dstate "rep/probe-$1.body")"; done < rep/routes.txt; rm -f "rep/probe-$1.body"; }
          probe 5061 > rep/routes-base-states.txt &
          BASE_PROBE=$!
          probe 5060 > rep/routes-head-states.txt
          wait "$BASE_PROBE"   # a bare wait would also wait on the head server and hang until timeout
          cut -d' ' -f1,2 rep/routes-base-states.txt > rep/routes-base.txt
          cut -d' ' -f1,2 rep/routes-head-states.txt > rep/routes-head.txt
          join rep/routes-base.txt rep/routes-head.txt > rep/routes-both.txt
          # route base_code base_state head_code head_state
          join rep/routes-base-states.txt rep/routes-head-states.txt > rep/routes-states.txt
          echo "--- routes whose status changed (route base head) ---"
          awk '$2!=$3' rep/routes-both.txt | tee rep/routes-changed.txt
          echo "--- head dataState per route (route head_code head_state), non-'-' only ---"
          awk '$5!="-" {print $1, $4, $5}' rep/routes-states.txt
          UNAVAIL=$(awk '$4=="503" && $5!="-"' rep/routes-states.txt | wc -l)
          echo "head 503 with dataState (structured unavailable, accepted): $UNAVAIL"
          awk '$4=="503" && $5!="-" {print "UNAVAILABLE", $1, $4, $5}' rep/routes-states.txt
          # Regression: base answered 2xx/3xx/4xx and head answers 000 (timeout/no
          # response), any 5xx other than 503, or a 503 without a dataState body.
          isreg='$2 ~ /^[234]/ && ($4 == "000" || ($4 ~ /^5/ && !($4 == "503" && $5 != "-")))'
          REGRESS=$(awk "$isreg" rep/routes-states.txt | wc -l)
          echo "head 500/000 (or 503 without dataState) where base was OK: $REGRESS"
          awk "$isreg"' {print "REGRESSION", $1, $2, $4, $5}' rep/routes-states.txt
          [ "$REGRESS" -eq 0 ] && echo "PASS no route regressions" || { echo "FAIL route regressions"; fail=1; }
          echo "head 500s: $(awk '$4 ~ /^5/ && $4 != "503"' rep/routes-states.txt | wc -l)  base 500s: $(awk '$2 ~ /^5/ && $2 != "503"' rep/routes-states.txt | wc -l)"
          echo "head 5xx count: $(awk '$3 ~ /^5/' rep/routes-both.txt | wc -l)  base 5xx count: $(awk '$2 ~ /^5/' rep/routes-both.txt | wc -l)"
          check "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5060/)" 200 "UI index served"
          { grep -E "uncaughtException|unhandledRejection|TypeError|ReferenceError" rep/server-head.log || true; } | sort | uniq -c | sort -rn | head -30 > rep/server-head-errors.txt
          { grep -E "uncaughtException|unhandledRejection|TypeError|ReferenceError" rep/server-base.log || true; } | sort | uniq -c | sort -rn | head -30 > rep/server-base-errors.txt
          echo "--- runtime errors head vs base (count) ---"; wc -l rep/server-head-errors.txt rep/server-base-errors.txt
          pkill -f "dist/index.cjs" || true; sleep 2

          if grep -q BATCAVE_ACCESS_KEY server/index.ts; then
            NODE_ENV=production PORT=5062 HOST=127.0.0.1 BATCAVE_ACCESS_KEY=ci-test-key node dist/index.cjs > rep/server-gated.log 2>&1 &
            wait_up 5062 || { echo "FAIL gated server did not start"; exit 1; }
            check "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5062/api/schwab/status)" 401 "gate blocks without key"
            check "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-batcave-key: wrong' http://127.0.0.1:5062/api/schwab/status)" 401 "gate blocks wrong key"
            check "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-batcave-key: ci-test-key' http://127.0.0.1:5062/api/schwab/status)" 200 "gate allows right key"
            NOTE=$(curl -s -m 60 -H "x-batcave-key: ci-test-key" http://127.0.0.1:5062/api/trade-environment | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const d=(j.drivers||[]).find(x=>x.key==="gamma");console.log(d?d.note:"no-gamma-driver")}catch(e){console.log("unparseable")}})')
            echo "gated gamma driver: $NOTE"
            { grep -c '401' rep/server-gated.log || true; } | xargs echo "gated server 401 log lines:"
            pkill -f "dist/index.cjs" || true
          else
            echo "SKIP access-key checks (gate not present)"
          fi
          if [ -f server/accessGate.ts ]; then
            # Reachable bind with no key must fail closed.
            NODE_ENV=production PORT=5063 HOST=0.0.0.0 node dist/index.cjs > rep/server-open.log 2>&1 &
            wait_up 5063 || { echo "FAIL fail-closed server did not start"; fail=1; }
            check "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5063/api/schwab/status)" 503 "public bind without key fails closed"
            check "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5063/api/health)" 200 "health stays open when locked"
            pkill -f "dist/index.cjs" || true
          fi
          exit $fail
      - name: Type-check gate (no file may gain tsc errors vs base)
        shell: bash
        run: |
          if [ ! -f rep/tsc-regressed.txt ] || [ ! -f rep/tsc-global-new.txt ]; then echo "FAIL type-check comparison did not run"; exit 1; fi
          fail=0
          if [ -s rep/tsc-regressed.txt ]; then
            echo "FAIL files with more tsc errors on head than base (file head base):"
            cat rep/tsc-regressed.txt
            fail=1
          fi
          if [ -s rep/tsc-global-new.txt ]; then
            echo "FAIL file-less tsc errors on head that base does not have:"
            cat rep/tsc-global-new.txt
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "PASS no file gained tsc errors and no new file-less errors"
          exit $fail
      - name: Screenshot every tab (no Schwab login in CI)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p rep/shots
          npx --yes playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          NODE_ENV=production PORT=5070 HOST=127.0.0.1 node dist/index.cjs > rep/server-shot.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:5070/api/health >/dev/null 2>&1 && break; sleep 1; done
          cat > shot.mjs <<'JS'
          import { chromium } from "playwright";
          const tabs = ["signals","chart","models","heatseeker","tradedesk","regime","cosmos","news","takefive","edgelab","crypto"];
          const b = await chromium.launch();
          async function open(vp) {
            const p = await b.newPage({ viewport: vp });
            const errors = [];
            p.on("pageerror", (e) => errors.push(e.message));
            await p.goto("http://127.0.0.1:5070/#/", { waitUntil: "networkidle", timeout: 60000 }).catch(() => {});
            await p.waitForTimeout(4000);
            await p.keyboard.press("Enter").catch(() => {});
            const splash = p.getByRole("button", { name: /print/i });
            if (await splash.count()) await splash.first().click({ timeout: 3000 }).catch(() => {});
            // The daily pre-market read must be scrolled to the end before its button enables.
            for (let k = 0; k < 4; k++) {
              await p.evaluate(() => document.querySelectorAll("div").forEach((d) => {
                if (d.scrollHeight > d.clientHeight + 10) { d.scrollTop = d.scrollHeight; d.dispatchEvent(new Event("scroll")); }
              }));
              await p.mouse.wheel(0, 5000).catch(() => {});
              await p.waitForTimeout(700);
            }
            await p.locator('[data-testid="button-premarket-acknowledge"]').click({ timeout: 8000 }).catch((e) => console.log("ack:", e.message.split("\\n")[0]));
            await p.waitForTimeout(8000);
            return { p, errors };
          }
          const { p, errors } = await open({ width: 1440, height: 900 });
          for (const [i, t] of tabs.entries()) {
            const btn = p.locator(`[data-testid="tab-${t}"]`);
            if (!(await btn.count())) { console.log("missing tab", t); continue; }
            await btn.first().click({ timeout: 5000 }).catch((e) => console.log(t, e.message.split("\n")[0]));
            await p.waitForTimeout(7000);
            await p.screenshot({ path: `rep/shots/${String(i + 1).padStart(2, "0")}-${t}.png`, fullPage: true });
            console.log("shot", t);
          }
          console.log("desktop page errors:", errors.length, errors.slice(0, 5));
          const m = await open({ width: 393, height: 852 });
          await m.p.screenshot({ path: "rep/shots/12-signals-iphone.png", fullPage: false });
          console.log("mobile page errors:", m.errors.length, m.errors.slice(0, 5));
          await b.close();
          JS
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && node shot.mjs 2>&1 | tee rep/shots/shot.log
          pkill -f "dist/index.cjs" || true
      - name: Demo edition (sample data) smoke test and screenshots
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p rep/demo
          npx --yes playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          npm ls playwright >/dev/null 2>&1 || npm i --no-save playwright@1.48.2 >/dev/null 2>&1
          # Public bind, no key: the demo must be open, read-only and Schwab-free.
          NODE_ENV=production PORT=5072 HOST=0.0.0.0 BATCAVE_EDITION=demo PULSE_ML_AUTOSTART=0 node dist/index.cjs > rep/server-demo.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:5072/api/health >/dev/null 2>&1 && break; sleep 1; done
          IP=$(hostname -I | awk '{print $1}')
          B="http://$IP:5072"
          fail=0
          check() { if [ "$1" = "$2" ]; then echo "PASS $3 ($1)"; else echo "FAIL $3 (got $1, want $2)"; fail=1; fi; }
          {
            curl -s "$B/api/health" | grep -q '"edition":"demo"' && echo "PASS health edition demo" || { echo "FAIL health edition"; fail=1; }
            curl -s "$B/api/health" | grep -q '"locked":false' && echo "PASS open without a key" || { echo "FAIL locked"; fail=1; }
            curl -s "$B/api/schwab/status" | grep -q '"demo":true' && echo "PASS status demo" || { echo "FAIL status demo"; fail=1; }
            check "$(curl -s -o /dev/null -w '%{http_code}' "$B/api/schwab/auth-url")" 403 "sign-in link refused"
            check "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$B/api/signals/track")" 403 "visitor write refused"
            check "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"redirectedUrl":"https://x/?code=a"}' "$B/api/schwab/callback")" 403 "token paste refused"
            check "$(curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Content-Type: application/json' -d '{}' "$B/api/flow/config")" 403 "config change refused"
            curl -s -o /dev/null -D - "$B/api/schwab/oauth/callback?code=a&state=b" | grep -qi 'location: .*demo_edition' && echo "PASS oauth callback refused" || { echo "FAIL oauth callback"; fail=1; }
            sleep 45
            echo "--- data endpoints on sample data (status, first 300 bytes) ---"
            for pth in /api/schwab/selftest /api/snapshot /api/trade-environment /api/regime /api/gamma-levels /api/models /api/heatseeker /api/iv-rv /api/chain-audit /api/edgelab/briefing "/api/heatmap/thermal?symbol=%24SPX&greek=gex" "/api/heatmap/thermal?symbol=%24SPX&greek=charm"; do
              code=$(curl -s -o rep/demo/body.json -m 60 -w '%{http_code}' "$B$pth")
              echo "$pth -> $code $(head -c 300 rep/demo/body.json | tr '\n' ' ')"
            done
            # Thermal heatmap on the sample chain: open-interest only, every contract accounted for, walls either side of spot.
            curl -s -m 60 "$B/api/heatmap/thermal?symbol=%24SPX&greek=gex" > rep/demo/thermal.json
            node -e '
              const j = JSON.parse(require("fs").readFileSync("rep/demo/thermal.json", "utf8"));
              const m = j.method, L = j.levels;
              const ok = j.dataState === "ok" && j.weightMode === "oi" && m.position === "open_interest" && j.cells.length > 0
                && L.putWall < j.spot && L.callWall > j.spot && L.gammaFlip >= j.strikes[0] && L.gammaFlip <= j.strikes[j.strikes.length - 1]
                && j.cells.every((c) => Number.isFinite(c.exposure));
              console.log((ok ? "PASS" : "FAIL") + " thermal heatmap: state " + j.dataState + ", " + j.cells.length + " cells, " + m.contractsUsed + " priced, " + m.contractsNoSigma + " no IV, put wall " + L.putWall + " < spot " + j.spot + " < call wall " + L.callWall + ", flip " + L.gammaFlip);
            '

            # Community watch on the demo: sample rows with ranges and costs; writes refused (read-only demo).
            curl -s -m 30 "$B/api/crypto/community" > rep/demo/community.json
            node -e '
              const j = JSON.parse(require("fs").readFileSync("rep/demo/community.json", "utf8"));
              const e = j.entries || [];
              const ok = j.edition === "demo" && j.writable === false && e.length >= 3
                && e.every((x) => x.quoteState === "ok" && x.range && x.range.rangePosition != null && x.cost1k && x.cost1k.roundTripPct != null && x.structure && x.line)
                && e.some((x) => x.range.deepDipsReclaimed >= 1)
                // On-chain facts: every sample row carries a read state; an unread concentration stays null (never a value), and the sample with an active mint authority names it.
                && e.every((x) => x.onChainState === "ok" && typeof x.mintAuthorityActive === "boolean" && typeof x.freezeAuthorityActive === "boolean")
                && e.some((x) => x.top10Pct != null) && e.some((x) => x.top10Pct == null && /unavailable/.test(x.top10Method || ""))
                && e.some((x) => x.mintAuthorityActive === true && (x.structure.reasons || []).some((r) => /mint authority active/.test(r)));
              console.log((ok ? "PASS" : "FAIL") + " community watch: " + e.length + " sample rows, reclaimed dips " + e.map((x) => x.range && x.range.deepDipsReclaimed).join("/") + ", $1k trips " + e.map((x) => x.cost1k && x.cost1k.roundTripPct).join("/") + "%, top-10 " + e.map((x) => x.top10Pct).join("/") + ", mint active " + e.map((x) => x.mintAuthorityActive).join("/"));
            '
            # Signals desk: the net-expectancy block is present under both exit rules, gated at the sample minimum, and every ENTER row carries a netGraded return or the reason it has none.
            curl -s -m 30 "$B/api/crypto/signals" > rep/demo/crypto-signals.json
            node -e '
              const j = JSON.parse(require("fs").readFileSync("rep/demo/crypto-signals.json", "utf8"));
              const x = j.expectancy || {};
              const sum = (s) => s && s.rule && Number.isFinite(s.n) && Number.isFinite(s.skipped) && s.positiveShare && s.sampleReady === (s.n >= s.minSample) && /net of pool fees/.test(s.note);
              const rows = j.signals || [];
              const rowsOk = rows.every((r) => r.verdict !== "ENTER" ? r.netGraded === null : (r.netGraded && r.netGraded.rule === "graded" && (r.netGraded.netPct == null) === (typeof r.netGraded.missing === "string")));
              const gated = !x.graded || x.graded.sampleReady || /counts only, no claim of edge/.test(x.graded.note);
              const ok = sum(x.graded) && sum(x.peak) && x.graded.rule === "graded" && x.peak.rule === "peak" && x.graded.sizeUsd === 100 && typeof x.basis === "string" && /not a hold/.test(x.basis) && /entry pool/.test(x.peak.note) && rowsOk && gated;
              console.log((ok ? "PASS" : "FAIL") + " crypto expectancy: graded n=" + (x.graded && x.graded.n) + " skipped=" + (x.graded && x.graded.skipped) + " ready=" + (x.graded && x.graded.sampleReady) + ", peak n=" + (x.peak && x.peak.n) + ", " + rows.length + " rows" + (ok ? "" : " body " + JSON.stringify(x).slice(0, 300)));
            '
            # 0DTE map on the sample chain: priced, labelled, no zones in the demo (investor limits), text free of instructions.
            curl -s -m 60 "$B/api/odte/map?symbol=%24SPX" > rep/demo/odte-map.json
            node -e '
              const j = JSON.parse(require("fs").readFileSync("rep/demo/odte-map.json", "utf8"));
              const labelled = (j.strikes || []).filter((s) => s.label).map((s) => s.label);
              // In the session the map is "ok"; after the close it is "stale_session" (the card marks it), never "no_gex" on the sample chain.
              const priced = j.dataState === "ok" || (j.dataState === "stale_session" && j.session && j.session.state === "closed");
              // In the last half hour 0DTE gamma sits on a handful of strikes, so few clear the 1% share floor.
              const nearClose = j.session && j.session.state === "open" && j.session.minutesToClose <= 30;
              // From Friday's close to Monday's open the one-day chain window holds no expiry: "unavailable / no_expiries" is the honest answer.
              const et = {}; for (const x of new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour12: false, hour: "2-digit", minute: "2-digit", weekday: "short" }).formatToParts(new Date())) et[x.type] = x.value;
              const etMin = (Number(et.hour) % 24) * 60 + Number(et.minute);
              const weekendGap = et.weekday === "Sat" || et.weekday === "Sun" || (et.weekday === "Fri" && etMin >= 16 * 60) || (et.weekday === "Mon" && etMin < 9 * 60 + 30);
              if (weekendGap && j.dataState === "unavailable" && j.error === "no_expiries") { console.log("PASS 0DTE map: no expiry inside the one-day window between Friday's close and Monday's open (unavailable / no_expiries, as it should be)"); process.exit(0); }
              const ok = priced && (j.strikes || []).length > (nearClose ? 2 : 5) && labelled.includes("pin") && j.zones === null && j.range && j.range.straddle > 0 && j.ledger && j.ledger.kept === false
                && (j.strikes || []).every((s) => Math.abs(s.gexPt - Math.round(s.gexPct / (j.spot / 100))) <= 1);
              console.log((ok ? "PASS" : "FAIL") + " 0DTE map: state " + j.dataState + ", spot " + j.spot + ", " + (j.strikes || []).length + " strikes, labels " + labelled.join("/") + ", straddle " + (j.range && j.range.straddle) + ", band " + JSON.stringify(j.band && [j.band.low, j.band.high]) + ", zones " + j.zones + ", ledger " + (j.ledger && j.ledger.why));
            '
            # Decision-support block from the live /api/models odds (the route used to throw ReferenceError: formatDecisionBlock was never imported).
            dcode=$(curl -s -o rep/demo/decision.json -m 60 -w '%{http_code}' "$B/api/decision-support")
            node -e '
              const code = process.argv[1];
              const j = JSON.parse(require("fs").readFileSync("rep/demo/decision.json", "utf8"));
              const ok = code === "200" && typeof j.block === "string" && Array.isArray(j.lines) && j.lines.length >= 3 && j.inputs && j.inputs.spot > 0;
              console.log((ok ? "PASS" : "FAIL") + " decision support: " + code + ", " + (j.lines ? j.lines.length : 0) + " lines, spot " + (j.inputs && j.inputs.spot) + (ok ? "" : " body " + JSON.stringify(j).slice(0, 200)));
            ' "$dcode"
            # Whale flow on the sample chains: the sample sweeps (1-3 DTE, lifted at the ask) pass the gate once the
            # session is 15 minutes old; pre-market and the first minutes after the open legitimately have none.
            curl -s -m 120 "$B/api/flow/preview" > rep/demo/flow-preview.json
            node -e '
              const j = JSON.parse(require("fs").readFileSync("rep/demo/flow-preview.json", "utf8"));
              const p = {}; for (const x of new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour12: false, hour: "2-digit", minute: "2-digit", weekday: "short" }).formatToParts(new Date())) p[x.type] = x.value;
              const mins = (Number(p.hour) % 24) * 60 + Number(p.minute);
              const quiet = !["Sat", "Sun"].includes(p.weekday) && mins < 9 * 60 + 45;
              const whales = Object.values(j.byTicker || {}).flatMap((t) => t.whales || []);
              const reasonsOk = whales.every((w) => /premium \((at observed prices|volume x mid, first scan)\)/.test(w.reason || ""));
              const ok = j.dataState === "ok" && j.tickersScanned >= 10 && reasonsOk && (quiet ? true : whales.length >= 1);
              console.log((ok ? "PASS" : "FAIL") + " whale flow preview: state " + j.dataState + ", " + j.tickersScanned + " tickers, " + j.totalScanned + " contracts, " + whales.length + " whales" + (quiet ? " (pre-open: none expected)" : "") + (whales[0] ? ", e.g. " + whales[0].symbol + " " + whales[0].occ.trim() + " " + whales[0].reason : ""));
            '
            wcode=$(curl -s -o /dev/null -m 30 -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"tokenAddress":"So11111111111111111111111111111111111111112"}' "$B/api/crypto/community")
            [ "$wcode" = "405" ] || [ "$wcode" = "403" ] && echo "PASS community write refused ($wcode)" || { echo "FAIL community write returned $wcode"; fail=1; }

            grep -ciE "api\.schwabapi\.com|\[schwab\] (401|403|fetch)" rep/server-demo.log | xargs -I{} echo "schwab network lines in log: {}"
          } 2>&1 | tee rep/demo/smoke.log
          grep -q '^FAIL' rep/demo/smoke.log && fail=1
          cat > demo-shot.mjs <<'JS'
          import { chromium } from "playwright";
          const base = process.env.DEMO_BASE;
          const tabs = ["signals","chart","models","heatseeker","tradedesk","regime","cosmos","news","takefive","edgelab","crypto"];
          const b = await chromium.launch();
          async function open(vp) {
            const p = await b.newPage({ viewport: vp });
            const errors = [];
            p.on("pageerror", (e) => errors.push(e.message));
            await p.goto(`${base}/#/`, { waitUntil: "networkidle", timeout: 60000 }).catch(() => {});
            await p.waitForTimeout(4000);
            for (let k = 0; k < 4; k++) {
              await p.evaluate(() => document.querySelectorAll("div").forEach((d) => {
                if (d.scrollHeight > d.clientHeight + 10) { d.scrollTop = d.scrollHeight; d.dispatchEvent(new Event("scroll")); }
              }));
              await p.mouse.wheel(0, 5000).catch(() => {});
              await p.waitForTimeout(700);
            }
            await p.locator('[data-testid="button-premarket-acknowledge"]').click({ timeout: 8000 }).catch(() => {});
            await p.waitForTimeout(8000);
            return { p, errors };
          }
          const { p, errors } = await open({ width: 1440, height: 900 });
          console.log("demo strip visible:", await p.locator('[data-testid="demo-strip"]').isVisible().catch(() => false));
          for (const [i, t] of tabs.entries()) {
            const btn = p.locator(`[data-testid="tab-${t}"]`);
            if (!(await btn.count())) { console.log("missing tab", t); continue; }
            await btn.first().click({ timeout: 5000 }).catch((e) => console.log(t, e.message.split("\n")[0]));
            await p.waitForTimeout(7000);
            await p.screenshot({ path: `rep/demo/${String(i + 1).padStart(2, "0")}-${t}.png`, fullPage: true });
          }
          console.log("desktop page errors:", errors.length, errors.slice(0, 5));
          // Today card (Signals, answer first) and the chart-levels rail (Trade Desk): both read the sample 0DTE map.
          try {
            await p.locator('[data-testid="tab-signals"]').first().click({ timeout: 5000 });
            await p.locator('[data-testid="today-card"], [data-testid="today-card-unavailable"]').first().waitFor({ timeout: 30000 });
            const todayOk = await p.locator('[data-testid="today-card"]').count();
            // Each of the three cells shows a thousand-separated level or an explicit "n/a" with its reason (pre-open the map can name
            // fewer than three landmarks: a missing one is said, never invented).
            const cells = todayOk ? await p.locator('[data-testid="today-wall-above"], [data-testid="today-flip"], [data-testid="today-magnet-below"]').allInnerTexts() : [];
            const nums = cells.filter((t) => /\d{1,2},\d{3}/.test(t)).length;
            const cellsOk = cells.length === 3 && cells.every((t) => /\d{1,2},\d{3}|n\/a/.test(t)) && nums >= 1;
            const noGex = await p.locator('[data-testid="today-no-gex"]').count();
            // The sample chain is priced in-session and after the close; between Friday's close and Monday's open the map is unavailable (no expiry) and the card says so.
            const unavailable = await p.locator('[data-testid="today-card-unavailable"]').count();
            const ok = (todayOk && (cellsOk || noGex)) || unavailable;
            console.log((ok ? "PASS" : "FAIL") + " today card: " + (todayOk ? "rendered, " + nums + " of 3 levels named, cells " + JSON.stringify(cells) + (noGex ? " (no gex state)" : "") : unavailable ? "unavailable state shown (no map)" : "missing"));
            await p.locator('[data-testid="tab-tradedesk"]').first().click({ timeout: 5000 });
            await p.locator('[data-testid="chart-levels-card"]').waitFor({ timeout: 30000 });
            await p.locator('[data-testid="chart-levels-input"]').fill("7686, 7643 7600");
            await p.locator('[data-testid="chart-levels-add"]').click();
            await p.locator('[data-testid="chart-levels-list"]').waitFor({ timeout: 10000 });
            const rows = await p.locator('[data-testid="chart-levels-list"] li').count();
            const tags = await p.locator('[data-testid^="chart-level-tag-"]').allInnerTexts();
            const tagOk = tags.length === 3 && tags.every((t) => /landmark|OI confluence|weak|chart only|unavailable/.test(t));
            // Without a map every level is "unavailable", never "chart only" (a missing map is not evidence of absence).
            const stateTxt = await p.locator('[data-testid="chart-levels-state"]').innerText().catch(() => "");
            const consistent = /ok|stale|no data/i.test(stateTxt) ? !tags.includes("unavailable") : tags.every((t) => t === "unavailable");
            console.log(((rows === 3 && tagOk && consistent) ? "PASS" : "FAIL") + " chart levels: " + rows + " rows, tags " + tags.join("/") + ", map state " + stateTxt.replace(/\s+/g, " ").slice(0, 40));
            await p.locator('[data-testid="chart-levels-card"]').screenshot({ path: "rep/demo/16-chart-levels.png" });
          } catch (e) { console.log("FAIL today/chart levels: " + String(e && e.message || e).split("\n")[0]); }
          // 3D exposure surface (Regime -> Thermal Gamma Map -> 3D): WebGL via SwiftShader.
          let g = null;
          try {
            g = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader", "--ignore-gpu-blocklist"] });
            const gp = await g.newPage({ viewport: { width: 1440, height: 900 } });
            const gerr = [];
            gp.on("pageerror", (e) => gerr.push(e.message));
            await gp.goto(`${base}/#/`, { waitUntil: "networkidle", timeout: 60000 }).catch(() => {});
            await gp.locator('[data-testid="button-premarket-acknowledge"]').click({ timeout: 8000 }).catch(() => {});
            await gp.locator('[data-testid="tab-regime"]').first().click({ timeout: 5000 });
            await gp.locator('[data-testid="thermal-view-3d"]').waitFor({ timeout: 30000 });
            const enabled = await gp.locator('[data-testid="thermal-view-3d"]').isEnabled();
            if (!enabled) {
              console.log("SKIP 3D surface: WebGL not available in this CI browser (button disabled, 2.5D fallback shown)");
            } else {
              await gp.locator('[data-testid="thermal-view-3d"]').click();
              await gp.locator('[data-testid="thermal-heatmap"] canvas').first().waitFor({ timeout: 30000 });
              await gp.waitForTimeout(6000);
              const txt = await gp.locator('[data-testid="thermal-heatmap"]').innerText();
              const signs = /long gamma/i.test(txt) && /short gamma/i.test(txt);
              const canvases = await gp.locator('[data-testid="thermal-heatmap"] canvas').count();
              await gp.locator('[data-testid="thermal-heatmap"]').screenshot({ path: "rep/demo/13-regime-3d.png" });
              const cx = await gp.locator('[data-testid="thermal-heatmap"] canvas').first().boundingBox();
              await gp.mouse.click(cx.x + cx.width * 0.5, cx.y + cx.height * 0.55);
              await gp.waitForTimeout(1500);
              const readout = await gp.locator('[data-testid="thermal-heatmap"]').innerText();
              const read = /OI c\//.test(readout);
              await gp.locator('[data-testid="thermal-heatmap"]').screenshot({ path: "rep/demo/14-regime-3d-readout.png" });
              const ok = canvases >= 1 && signs && gerr.length === 0;
              console.log((ok ? "PASS" : "FAIL") + " 3D surface: " + canvases + " canvas, sign labels " + signs + ", readout after a blind centre tap " + read + " (informational: the tap can miss the mesh), page errors " + gerr.length + (gerr[0] ? " " + gerr[0].slice(0, 160) : ""));
              // Rotated camera on three screen sizes: no two visible labels may touch (the expiry
              // ticks piled up into "13d11d10d" after a rotation on a 2000 px window), the canvas
              // must keep a readable aspect, and nothing may overflow the page.
              const collisions = async () => gp.evaluate(() => {
                const els = Array.from(document.querySelectorAll('[data-testid="thermal-surface3d-host"] .s3d-tick, [data-testid="thermal-surface3d-host"] .s3d-axis, [data-testid="thermal-surface3d-host"] .s3d-level'))
                  .filter((e) => e.style.visibility !== "hidden" && e.style.display !== "none");
                const rects = els.map((e) => ({ t: e.textContent.trim(), r: e.getBoundingClientRect() })).filter((x) => x.r.width > 0 && x.r.height > 0);
                const bad = [];
                for (let i = 0; i < rects.length; i++) for (let j = i + 1; j < rects.length; j++) {
                  const a = rects[i].r, b = rects[j].r;
                  if (a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top) bad.push(rects[i].t + " x " + rects[j].t);
                }
                const cv = document.querySelector('[data-testid="thermal-surface3d-host"] canvas').getBoundingClientRect();
                return { labels: rects.length, bad, aspect: cv.width / cv.height, overflow: document.documentElement.scrollWidth > innerWidth };
              });
              let rotOk = true;
              for (const [name, vp] of [["desktop", { width: 1440, height: 900 }], ["ultrawide", { width: 2000, height: 1000 }], ["phone", { width: 390, height: 844 }]]) {
                await gp.setViewportSize(vp);
                await gp.waitForTimeout(800);
                if (name === "phone") await gp.locator('[data-testid="thermal-surface3d-host"]').scrollIntoViewIfNeeded();
                for (let k = 0; k < 3; k++) { await gp.locator('[data-testid="surface3d-rotate-right"]').click(); await gp.waitForTimeout(150); }
                const r1 = await collisions();
                await gp.locator('[data-testid="surface3d-view-side"]').click(); await gp.waitForTimeout(400);
                const r2 = await collisions();
                await gp.locator('[data-testid="thermal-surface3d-host"]').screenshot({ path: `rep/demo/15-regime-3d-rotated-${name}.png` });
                await gp.locator('[data-testid="surface3d-view-reset"]').click(); await gp.waitForTimeout(300);
                const bad = [...r1.bad, ...r2.bad];
                const aspectOk = r1.aspect <= 2.6 && r1.aspect >= 0.8;
                const okHere = bad.length === 0 && aspectOk && !r1.overflow;
                rotOk = rotOk && okHere;
                console.log((okHere ? "PASS" : "FAIL") + " 3D rotated " + name + ": " + r1.labels + " labels, " + bad.length + " touching" + (bad[0] ? " (" + bad.slice(0, 4).join("; ") + ")" : "") + ", canvas aspect " + r1.aspect.toFixed(2) + ", overflow " + r1.overflow);
              }
            }
          } catch (e) { console.log("FAIL 3D surface: " + String(e && e.message || e).split("\n")[0]); }
          finally { if (g) await g.close().catch(() => {}); }
          const m = await open({ width: 393, height: 852 });
          await m.p.screenshot({ path: "rep/demo/12-signals-iphone.png", fullPage: false });
          console.log("mobile page errors:", m.errors.length, m.errors.slice(0, 5));
          await b.close();
          JS
          DEMO_BASE="$B" node demo-shot.mjs 2>&1 | tee rep/demo/shot.log
          grep -q '^FAIL' rep/demo/shot.log && fail=1
          pkill -f "dist/index.cjs" || true
          exit $fail
      - name: UX audit (every tab at six screen sizes)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npx --yes playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          npm ls playwright >/dev/null 2>&1 || npm i --no-save playwright@1.48.2 >/dev/null 2>&1
          NODE_ENV=production PORT=5071 HOST=127.0.0.1 node dist/index.cjs > rep/server-ux.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:5071/api/health >/dev/null 2>&1 && break; sleep 1; done
          rc=0
          BASE_URL=http://127.0.0.1:5071 UX_OUT=rep/ux timeout 1500 node tests/ux/ux-audit.mjs 2>&1 | tail -40 | tee rep/ux-run.log || rc=$?
          pkill -f "dist/index.cjs" || true
          # The UX scorecard (tests/ux/budget.json) gates the build: a screen that
          # got worse on any device fails this step.
          exit $rc
      - name: Publish report to ci-reports-quant branch
        if: always()
        run: |
          mkdir -p /tmp/rep && cp -R rep/. /tmp/rep/ 2>/dev/null || true
          for f in /tmp/rep/server-*.log; do [ -f "$f" ] && tail -400 "$f" > "$f.tail" && mv "$f.tail" "$f"; done
          echo "run ${GITHUB_RUN_ID} sha ${GITHUB_SHA}" > /tmp/rep/RUN.txt
          cd /tmp/rep && git init -q && git checkout -q -b ci-reports-quant
          git -c user.name=batcave-ci -c user.email=batcave-ci@users.noreply.github.com add -A
          git -c user.name=batcave-ci -c user.email=batcave-ci@users.noreply.github.com commit -qm "quant report ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-reports-quant
