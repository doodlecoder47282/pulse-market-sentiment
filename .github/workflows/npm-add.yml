# Adds or updates an npm dependency from CI (the dev workspace cannot reach the
# npm registry) and commits package.json + package-lock.json to the branch the
# request came from. Trigger: push a change to .github/npm-add.txt (one line of
# space-separated package specs). workflow_dispatch only works from the
# default branch, so a request file is used instead.
name: Add npm dependency
on:
  push:
    paths: [".github/npm-add.txt"]
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          set -euo pipefail
          PKGS="$(head -n1 .github/npm-add.txt | tr -d '\r')"
          echo "PKGS=$PKGS" >> "$GITHUB_ENV"
          # Only plain package specs: letters, digits, @ / . - _ ^ ~ and spaces.
          [[ "$PKGS" =~ ^[A-Za-z0-9@/._^~\ -]+$ ]] || { echo "bad package spec"; exit 1; }
          npm install $PKGS --save --no-audit --no-fund
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "deps: add $PKGS (via CI)"
          git push origin HEAD:${{ github.ref_name }}
