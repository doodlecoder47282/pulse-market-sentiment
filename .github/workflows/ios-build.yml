name: iOS build (Xcode project)

# Builds the web UI, syncs it into the Capacitor Xcode project, compiles the
# app for the iOS Simulator without signing, takes a simulator screenshot and
# publishes a ready-to-open Xcode zip to the ci-reports-ios branch.
# Runs when the iOS project changes; to rebuild after UI-only changes, edit
# .github/ios-build.txt. Nothing is committed back to the source branch.

on:
  push:
    branches: [quant-fixes, main]
    paths:
      - "ios/**"
      - "capacitor.config.json"
      - ".github/ios-build.txt"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: |
          mkdir -p reports
          { xcodebuild -version; node -v; npm -v; sw_vers; } 2>&1 | tee reports/00-toolchain.log
      - name: Install dependencies
        run: |
          set -o pipefail
          # Install scripts run: the demo server needs the better-sqlite3 binary.
          npm ci --no-audit --no-fund 2>&1 | tail -20 | tee reports/01-npm-ci.log
          if ! grep -q '"@capacitor/ios"' package.json; then
            npm install --no-save --no-audit --no-fund --ignore-scripts @capacitor/cli@8.5.2 @capacitor/core@8.5.2 @capacitor/ios@8.5.2 2>&1 | tail -20 | tee -a reports/01-npm-ci.log
          fi
          npx cap --version 2>&1 | tee -a reports/01-npm-ci.log
      - name: Build app and server for the simulator check
        env:
          # Screenshot build only: the app talks to a demo server on this runner.
          VITE_API_BASE: http://127.0.0.1:5080
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -30 | tee reports/02-build.log
      - name: Start a sample-data demo server
        run: |
          NODE_ENV=production PORT=5080 HOST=127.0.0.1 BATCAVE_EDITION=demo PULSE_ML_AUTOSTART=0 node dist/index.cjs > reports/server-demo.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:5080/api/health >/dev/null 2>&1 && break; sleep 1; done
          curl -s http://127.0.0.1:5080/api/health | tee reports/06-demo-health.log
      - name: Sync the Xcode project
        run: |
          set -o pipefail
          # CI-only: allow plain http to the runner's demo server. Reverted before packaging.
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/App/App/Info.plist
          npx cap sync ios 2>&1 | tee reports/03-cap.log
          find ios -maxdepth 3 -not -path '*/public/*' | sort | tee -a reports/03-cap.log
      - name: Compile for iOS Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build > reports/04-xcodebuild-full.log 2>&1
          rc=$?
          grep -E "error:|warning: .*(launch|Launch)|BUILD (SUCCEEDED|FAILED)" reports/04-xcodebuild-full.log | head -60 > reports/04-xcodebuild.log || true
          tail -40 reports/04-xcodebuild-full.log >> reports/04-xcodebuild.log
          exit $rc
      - name: iPhone 17 simulator screenshots
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          exact=[x for x in c if x['name']=='iPhone 17']
          near=[x for x in c if x['name'].startswith('iPhone 17')]
          pick=(exact or near or c)
          print(pick[-1]['udid'] if pick else '')")
          xcrun simctl list devices available | grep "$UDID" | tee reports/07-sim.log
          xcrun simctl boot "$UDID" 2>&1 | tee -a reports/07-sim.log
          xcrun simctl bootstatus "$UDID" -b 2>&1 | tail -2 | tee -a reports/07-sim.log
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 2>&1 | tee -a reports/07-sim.log
          xcrun simctl ui "$UDID" appearance dark 2>&1 | tee -a reports/07-sim.log
          APP=$(find build/dd/Build/Products -name 'App.app' -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP" 2>&1 | tee -a reports/07-sim.log
          xcrun simctl launch "$UDID" com.batcave.terminal 2>&1 | tee -a reports/07-sim.log
          sleep 1
          xcrun simctl io "$UDID" screenshot reports/ios-launch.png 2>&1 | tee -a reports/07-sim.log
          sleep 50
          xcrun simctl io "$UDID" screenshot reports/ios-sim.png 2>&1 | tee -a reports/07-sim.log
          # Diagnostics: how fast the demo answers the dashboard's first calls.
          for pth in /api/snapshot /api/regime /api/macro; do
            echo "$pth -> $(curl -s -o /dev/null -m 60 -w '%{http_code} in %{time_total}s' http://127.0.0.1:5080$pth)" | tee -a reports/07-sim.log
          done
          sleep 20
          xcrun simctl io "$UDID" screenshot reports/ios-sim-later.png 2>&1 | tee -a reports/07-sim.log
          # The same demo in Mobile Safari on the same phone (the website path).
          xcrun simctl terminate "$UDID" com.batcave.terminal 2>&1 | tee -a reports/07-sim.log
          xcrun simctl openurl "$UDID" "http://127.0.0.1:5080/#/" 2>&1 | tee -a reports/07-sim.log
          sleep 40
          xcrun simctl io "$UDID" screenshot reports/ios-safari.png 2>&1 | tee -a reports/07-sim.log
          grep -c "GET /api" reports/server-demo.log | xargs -I{} echo "demo server API requests: {}" | tee -a reports/07-sim.log
      - name: iPad simulator screenshots (portrait and landscape, three sizes)
        continue-on-error: true
        run: |
          APP=$(find build/dd/Build/Products -name 'App.app' -maxdepth 3 | head -1)
          xcrun simctl list devices available | grep -i ipad | tee -a reports/07-sim.log
          for want in "iPad Pro 13-inch" "iPad Air 11-inch" "iPad mini"; do
            UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          w=sys.argv[1]
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith(w)]
          print(c[-1]['udid'] if c else '')" "$want")
            [ -z "$UDID" ] && { echo "no simulator for $want" | tee -a reports/07-sim.log; continue; }
            tag=$(echo "$want" | tr -c 'A-Za-z0-9' '-' | sed 's/-*$//')
            xcrun simctl boot "$UDID" 2>&1 | tee -a reports/07-sim.log
            xcrun simctl bootstatus "$UDID" -b 2>&1 | tail -1 | tee -a reports/07-sim.log
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 2>/dev/null || true
            xcrun simctl ui "$UDID" appearance dark 2>/dev/null || true
            xcrun simctl install "$UDID" "$APP" 2>&1 | tee -a reports/07-sim.log
            xcrun simctl launch "$UDID" com.batcave.terminal 2>&1 | tee -a reports/07-sim.log
            sleep 45
            xcrun simctl io "$UDID" screenshot "reports/ipad-$tag-portrait.png" 2>&1 | tee -a reports/07-sim.log
            # Rotate to landscape (simctl has no rotate verb; the app re-lays out on the resize event).
            osascript -e 'tell application "Simulator" to activate' -e 'tell application "System Events" to keystroke "l" using {command down}' 2>&1 | tee -a reports/07-sim.log || true
            sleep 8
            xcrun simctl io "$UDID" screenshot "reports/ipad-$tag-landscape.png" 2>&1 | tee -a reports/07-sim.log
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
          done
          pkill -f "dist/index.cjs" || true
      - name: Rebuild the bundled UI for the zip (no test server baked in)
        env:
          VITE_DEMO_URL: ${{ vars.BATCAVE_DEMO_URL }}
          VITE_API_BASE: ${{ vars.BATCAVE_API_BASE }}
        run: |
          set -o pipefail
          git checkout -- ios/App/App/Info.plist
          npx vite build 2>&1 | tail -5 | tee reports/08-vite-zip.log
          npx cap copy ios 2>&1 | tail -5 | tee -a reports/08-vite-zip.log
          grep -rl "127.0.0.1:5080" ios/App/App/public && { echo "test server URL leaked into the zip"; exit 1; } || echo "zip bundle clean" | tee -a reports/08-vite-zip.log
      - name: Package Xcode project zip
        run: |
          mkdir -p out/Batcave-iOS
          rsync -a --exclude 'build' --exclude 'DerivedData' --exclude 'xcuserdata' ios/ out/Batcave-iOS/ios/
          cp capacitor.config.json out/Batcave-iOS/
          cp .github/ios-OPEN-ME.txt out/Batcave-iOS/OPEN-ME.txt
          echo "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} on $(date -u +%Y-%m-%dT%H:%MZ) with $(xcodebuild -version | head -1)" >> out/Batcave-iOS/OPEN-ME.txt
          cd out && ditto -c -k --sequesterRsrc --keepParent Batcave-iOS Batcave-iOS-Xcode.zip && ls -la | tee -a ../reports/05-package.log
      - uses: actions/upload-artifact@v4
        with:
          name: Batcave-iOS-Xcode
          path: out/Batcave-iOS-Xcode.zip
      - name: Publish build report to ci-reports-ios branch
        if: always()
        run: |
          mkdir -p /tmp/rep && cp -R reports/. /tmp/rep/ 2>/dev/null || true
          rm -f /tmp/rep/04-xcodebuild-full.log
          tail -300 reports/04-xcodebuild-full.log > /tmp/rep/04-xcodebuild-tail.log 2>/dev/null || true
          cp out/Batcave-iOS-Xcode.zip /tmp/rep/ 2>/dev/null || true
          echo "run ${GITHUB_RUN_ID} ref ${GITHUB_REF_NAME} sha ${GITHUB_SHA}" > /tmp/rep/RUN.txt
          cd /tmp/rep && git init -q && git checkout -q -b ci-reports-ios
          git -c user.name=batcave-ci -c user.email=batcave-ci@users.noreply.github.com add -A
          git -c user.name=batcave-ci -c user.email=batcave-ci@users.noreply.github.com commit -qm "ios report ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-reports-ios
